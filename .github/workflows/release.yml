name: Linux candidate artifacts (no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked
      - run: python3 -m unittest discover -s tests -p test_dual_installer.py -v
      - run: python3 -m unittest discover -s tests -p test_dual_tty.py -v
      - run: cargo build --release --locked --bins
      - name: Package candidate (not trusted release)
        run: |
          mkdir candidate
          cp target/release/claude-code-dual target/release/claude-code-proxy LICENSE candidate/
          tar -C candidate -czf claude-code-dual-linux-x86_64-gnu.tar.gz claude-code-dual claude-code-proxy LICENSE
          sha256sum claude-code-dual-linux-x86_64-gnu.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: unvalidated-linux-candidate
          path: |
            claude-code-dual-linux-x86_64-gnu.tar.gz
            SHA256SUMS
          retention-days: 7
